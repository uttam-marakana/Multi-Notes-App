<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      function setFavicon(href) {
        let link =
          document.querySelector("link[rel='icon']") ||
          document.createElement("link");
        link.rel = "icon";
        link.href = href;
        if (!document.head.contains(link)) {
          document.head.appendChild(link);
        }
      }

      const testFavicon = new Image();
      testFavicon.src = "/favicon.png";

      testFavicon.onload = function () {
        setFavicon(testFavicon.src);
      };

      testFavicon.onerror = function () {
        setFavicon("/favicon.png");
      };
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Noteflow is a modern notes workspace for organizing boards, rich-text notes, attachments, and protected content." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noteflow" />
    <meta property="og:title" content="Noteflow — Organize your ideas in one place" />
    <meta property="og:description" content="Organize boards, rich-text notes, attachments, and protected content in one focused workspace." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Noteflow — Organize your ideas in one place" />
    <meta name="twitter:description" content="A modern workspace for organizing boards and rich-text notes." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Noteflow — Organize your ideas in one place</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
